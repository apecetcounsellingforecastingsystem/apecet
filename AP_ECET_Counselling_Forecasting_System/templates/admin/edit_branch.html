{% extends "base.html" %}
{% block title %}Edit Branch — Admin{% endblock %}
{% block content %}
<div class="container" style="max-width: 560px; margin: 2rem auto;">
  <div class="glass-panel" style="padding: 2rem;">
    <h2 style="margin-top:0;">Edit Branch: {{ branch.branch_code }}</h2>
    <form method="POST">
      <div style="margin-bottom:1rem;">
        <label class="form-label">Branch Name</label>
        <input type="text" name="branch_name" class="form-control" value="{{ branch.branch_name or '' }}" required>
      </div>
      <div style="margin-bottom:1.5rem;">
        <label class="form-label">Department</label>
        <input type="text" name="department" class="form-control" value="{{ branch.department or 'Engineering' }}">
      </div>
      <button type="submit" class="btn-primary-glass">Save Changes</button>
      <a href="{{ url_for('admin_branches') }}" style="margin-left:1rem;">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
