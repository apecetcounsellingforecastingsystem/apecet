{% extends "base.html" %}
{% block title %}Change Password — AP ECET Counselling Forecasting System{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-panel" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.75rem; margin-top: 0.5rem;">Change Password</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Update your account password securely</p>
    </div>

    <form method="POST" action="{{ url_for('change_password') }}">
      <div style="margin-bottom: 1.25rem;">
        <label class="form-label" for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label class="form-label" for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>

      <button type="submit" class="btn-primary-glass" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Update Password
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      <a href="{{ url_for('profile_page') if session.get('role') != 'admin' else url_for('admin_dashboard') }}" style="font-weight: 600;">← Back</a>
    </div>
  </div>
</div>
{% endblock %}
